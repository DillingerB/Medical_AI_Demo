<!DOCTYPE html>
<html>
<head>
  <title>Medical AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="intro">

<div class="center">
  <h1>Medical AI</h1>

  <!-- USERNAME -->
  <input type="text" id="username" placeholder="Username">
  <div class="error" id="userError"></div>

  <!-- PASSWORD -->
  <input type="password" id="password" placeholder="Password" onfocus="showPasswordHelp()" onblur="hidePasswordHelp()">
  <div class="hint" id="passwordHint"></div>
  <div class="error" id="passError"></div>

  <!-- patient/provider -->
   <input type="checkbox" id="patient" name="patient">
   <label for="patient">Patient</label>

   <input type="checkbox" id="medical-providor" name="medical-providor">
   <label for="medical-providor">Medical Providor</label>
   <div class="error" id="roleError"></div>

  <button id="signup" onclick="auth.signup()">Sign Up</button>
  <button id="login" onclick="auth.login()">Log In</button>
</div>

<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
